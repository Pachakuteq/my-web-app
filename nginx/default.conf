# Nginx server block - defines how to handle incoming requests
server {
    listen 80;      # Listen for HTTP traffic on port 80

    # Forward all requests to Django/Gunicorn on port 8000
    # Uses service name "django" - Docker resolves this internally
    location / {
        proxy_pass http://django:8000;
        proxy_set_header Host $host;                # Pass original host header
        proxy_set_header X-Real-IP $remote_addr;    # Pass real client IP to Django
    }

    # Serve static files directly from Nginx without hitting Django
    location /static/ {
        alias /app/website/staticfiles/;
    }

    # Serve media files directly from Nginx without hitting Django
    location /media/ {
        alias /app/website/media/;
    }
}